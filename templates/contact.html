{% extends "base.html" %}
{% block title %}Contact — Frog in Space{% endblock %}
{% block content %}
<section class="page-section">
  <h1 class="page-title">Contact Us</h1>
  <div class="contact-icon-links">
    {% if data.instagram %}<a href="{{ data.instagram }}" target="_blank" rel="noopener" class="contact-icon-link instagram-icon" aria-label="Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17.5" cy="6.7" r="1" fill="currentColor"/></svg></a>{% endif %}
    {% if data.youtube %}<a href="{{ data.youtube }}" target="_blank" rel="noopener" class="contact-icon-link youtube-icon" aria-label="YouTube" title="YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m10 9 5 3-5 3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></a>{% endif %}
    <a href="mailto:{{ data.contact_email }}?subject=Frog%20in%20Space%20Inquiry" class="contact-icon-link email-icon" aria-label="Email" title="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 7 8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
</section>
{% endblock %}
