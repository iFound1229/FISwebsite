<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Frog in Space</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.28), transparent 28%),
        linear-gradient(135deg, #75c6ff, #b5e8c2);
    }
    .login-card {
      width: min(100%, 430px);
      padding: 28px;
      border-radius: 20px;
      background: rgba(255,255,255,.94);
      box-shadow: 0 20px 50px rgba(27,91,107,.18);
    }
    .login-brand { text-align:center; margin-bottom:22px; }
    .login-brand h1 { color:#164f48; margin-bottom:6px; }
    .login-brand p { color:#40665e; }
    .login-image {
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:12px;
      margin-bottom:20px;
      background:linear-gradient(135deg,#d7f3df,#a8dfbb);
    }
    .login-image-placeholder {
      display:grid;
      place-items:center;
      color:#27634f;
      font-weight:700;
    }
    .login-field { margin-bottom:16px; }
    .login-field label { display:block; color:#164f48; font-weight:700; margin-bottom:7px; }
    .login-field input {
      width:100%;
      border:1px solid #b5d6c0;
      border-radius:9px;
      padding:12px 13px;
      font:inherit;
      color:#163e38;
      background:#f7fcf8;
    }
    .login-field input:focus { outline:3px solid rgba(117,198,255,.35); border-color:#55a875; }
    .password-row { display:flex; gap:8px; }
    .password-row input { flex:1; }
    .show-password {
      border:1px solid #b5d6c0;
      border-radius:9px;
      background:#e2f3e6;
      color:#164f48;
      padding:0 12px;
      font-weight:700;
      cursor:pointer;
    }
    .login-button {
      width:100%;
      border:0;
      border-radius:9px;
      padding:13px;
      background:linear-gradient(135deg,#4d9ee4,#4fa873);
      color:white;
      font:inherit;
      font-weight:800;
      cursor:pointer;
    }
    .login-button:disabled { opacity:.7; cursor:wait; }
    .login-error { background:#fee2e2; color:#991b1b; padding:10px 12px; border-radius:8px; margin-bottom:16px; font-weight:600; }
    .login-help { text-align:center; color:#58756d; font-size:13px; margin-top:16px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-brand">
      {% if data.login_image %}
        <img class="login-image" src="{{ asset_url(data.login_image) }}" alt="Frog in Space admin" />
      {% else %}
        <div class="login-image login-image-placeholder">Frog in Space</div>
      {% endif %}
      <h1>Admin Login</h1>
      <p>Manage the Frog in Space website.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="login-error" role="alert">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login', next='/lilyrose') }}" id="login-form">
      <input type="hidden" name="login_csrf" value="{{ login_csrf }}" />
      <input type="hidden" name="next" value="/lilyrose" />
      <div class="login-field">
        <label for="admin-email">Email</label>
        <input id="admin-email" name="email" type="email" autocomplete="username" required maxlength="254" />
      </div>
      <div class="login-field">
        <label for="admin-password">Password</label>
        <div class="password-row">
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required maxlength="256" />
          <button type="button" class="show-password" id="show-password">Show</button>
        </div>
      </div>
      <button type="submit" class="login-button" id="login-button">Log In</button>
    </form>
    <p class="login-help">Your session expires after 15 minutes of inactivity.</p>
  </main>
  <script>
    const password = document.getElementById('admin-password');
    const showPassword = document.getElementById('show-password');
    const form = document.getElementById('login-form');
    const loginButton = document.getElementById('login-button');
    showPassword.addEventListener('click', () => {
      const visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      showPassword.textContent = visible ? 'Show' : 'Hide';
    });
    form.addEventListener('submit', () => {
      loginButton.disabled = true;
      loginButton.textContent = 'Logging in…';
    });
  </script>
</body>
</html>
