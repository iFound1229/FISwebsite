<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Frog in Space{% endblock %}</title>
    <link rel="icon" href="{{ asset_url(data.nav_logo) if data.nav_logo else url_for('static', filename='uploads/logo.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="tabs">
    <a href="{{ url_for('home') }}" class="nav-brand" aria-label="Frog in Space home">
      <img src="{{ asset_url(data.nav_logo) if data.nav_logo else url_for('static', filename='uploads/logo.png') }}" alt="Frog in Space" />
    </a>
    <button class="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
      <span class="mobile-nav-toggle-icon" aria-hidden="true">☰</span>
      <span>Menu</span>
    </button>
    <div class="nav-menu" id="primary-navigation">
      <a href="{{ url_for('home') }}" class="tab {% if active=='home' %}active{% endif %}">Home</a>
      <a href="{{ url_for('store') }}" class="tab {% if active=='store' %}active{% endif %}">Store</a>
      <details class="nav-dropdown {% if active=='events' %}active{% endif %}">
        <summary class="tab">Events</summary>
        <div class="dropdown-menu">
          <a href="{{ url_for('events') }}">Events Home</a>
          <a href="{{ url_for('shows') }}">Shows</a>
          <a href="{{ url_for('songlist') }}">Song List</a>
        </div>
      </details>
      <details class="nav-dropdown {% if active=='about' %}active{% endif %}">
        <summary class="tab">About Us</summary>
        <div class="dropdown-menu">
          <a href="{{ url_for('bio') }}">Bio</a>
          <a href="{{ url_for('members') }}">Members</a>
        </div>
      </details>
      <a href="{{ url_for('contact') }}" class="tab {% if active=='contact' %}active{% endif %}">Contact Us</a>
    </div>
    <div class="nav-actions">
      <a href="{{ url_for('store_cart') }}" class="cart-nav" aria-label="Go to cart" title="Go to cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L20.5 8H6M10 20a1 1 0 1 1-2 0 1 1 0 0 1 2 0Zm8 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="cart-count" data-cart-count>0</span>
      </a>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
